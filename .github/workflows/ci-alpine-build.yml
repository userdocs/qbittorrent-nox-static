name: ci - alpine build

on:
  workflow_call:
    inputs:
      workflow-files:
        description: "Alpine: workflow-files files"
        required: true
        type: string
      icu:
        description: "enable icu"
        required: true
        type: string
      debug:
        description: "debug builds"
        required: true
        type: string
      script_name:
        description: "script name"
        required: true
        type: string
      libtorrent_1_2:
        description: "Build libtorrent 1.2"
        required: true
        default: true
        type: boolean
      libtorrent_2_0:
        description: "Build libtorrent 2.0"
        required: true
        default: true
        type: boolean
      libtorrent_2_1:
        description: "Build libtorrent 2.1"
        required: true
        default: true
        type: boolean
      libtorrent_1_2_tag:
        description: "libtorrent 1.2 tag"
        required: false
        type: string
      libtorrent_1_2_qbittorrent_tag:
        description: "qBittorrent tag for libtorrent 1.2"
        required: false
        type: string
      libtorrent_2_0_tag:
        description: "libtorrent 2.0 tag"
        required: false
        type: string
      libtorrent_2_0_qbittorrent_tag:
        description: "qBittorrent tag for libtorrent 2.0"
        required: false
        type: string
      libtorrent_2_1_tag:
        description: "libtorrent 2.1 tag"
        required: false
        type: string
      libtorrent_2_1_qbittorrent_tag:
        description: "qBittorrent tag for libtorrent 2.1"
        required: false
        type: string
      openssl_tag:
        description: "OpenSSL tag"
        required: false
        type: string
      boost_tag:
        description: "Boost tag"
        required: false
        type: string
      qt_version:
        description: "Qt version"
        required: false
        type: string
      qt_tag:
        description: "Qt tag"
        required: false
        type: string

jobs:
  setup:
    runs-on: ubuntu-26.04-arm
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - id: matrix
        run: |
          versions='[]'
          [[ '${{ inputs.libtorrent_1_2 }}' == 'true' ]] && versions=$(printf '%s' "${versions}" | jq -c '. + ["1.2"]')
          [[ '${{ inputs.libtorrent_2_0 }}' == 'true' ]] && versions=$(printf '%s' "${versions}" | jq -c '. + ["2.0"]')
          [[ '${{ inputs.libtorrent_2_1 }}' == 'true' ]] && versions=$(printf '%s' "${versions}" | jq -c '. + ["2.1"]')
          printf 'versions=%s\n' "${versions}" >> "$GITHUB_OUTPUT"
  build:
    needs: [setup]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        runs_on: ["ubuntu-26.04-arm"]
        os_id: ["alpine"]
        os_version_id: ["edge"]
        qbt_cross_name: ["armhf", "armv7", "aarch64", "riscv64", "x86_64", "x86"]
        qbt_libtorrent_version: ${{ fromJSON(needs.setup.outputs.versions) }}
        qbt_build_tool: [""]
        qbt_linker_mold: ["yes"]
        include:
          - qbt_build_tool: ""
            qbt_qt_version_name: ""

    name: "${{ matrix.qbt_cross_name }}-${{ matrix.qbt_qt_version_name }}libtorrent-v${{ matrix.qbt_libtorrent_version }}"

    env:
      qbt_build_dir: "qbt-build"
      script_name: ${{ inputs.script_name }}
      set_skip_icu: ${{ inputs.icu }}
      set_workflow_files: ${{ inputs.workflow-files }}
      set_build_debug: ${{ inputs.debug }}
      set_qbt_mcm_url: "userdocs/musl-cross-make" # default is userdocs/qbt-musl-cross-make
      set_qbt_with_qemu: "" # default is yes
      set_qbt_host_deps: "" # default is no
      set_qbt_host_deps_repo: "" # default is userdocs/qbt-host-deps
      workspace: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download ${{ env.script_name }}
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          if [[ ! -f "${script_name}" ]]; then
            gh api "repos/${{ github.repository }}/contents/${script_name}" \
              --header "Accept: application/vnd.github.raw+json" > "${script_name}"
            chmod +x "${script_name}"
          fi

      - name: Host - Create Docker template env file
        env:
          INPUT_OPENSSL_TAG: ${{ matrix.qbt_libtorrent_version == '1.2' && 'openssl-3.5.9' || inputs.openssl_tag }}
          INPUT_BOOST_TAG: ${{ inputs.boost_tag }}
          MATRIX_LT_VERSION: ${{ matrix.qbt_libtorrent_version }}
          INPUT_LT_TAG: ${{ matrix.qbt_libtorrent_version == '2.1' && inputs.libtorrent_2_1_tag || matrix.qbt_libtorrent_version == '2.0' && inputs.libtorrent_2_0_tag || inputs.libtorrent_1_2_tag }}
          INPUT_QT_VERSION: ${{ inputs.qt_version }}
          INPUT_QT_TAG: ${{ inputs.qt_tag }}
          INPUT_QBT_TAG: ${{ matrix.qbt_libtorrent_version == '2.1' && inputs.libtorrent_2_1_qbittorrent_tag || matrix.qbt_libtorrent_version == '2.0' && inputs.libtorrent_2_0_qbittorrent_tag || inputs.libtorrent_1_2_qbittorrent_tag }}
          MATRIX_BUILD_TOOL: ${{ matrix.qbt_build_tool }}
          MATRIX_CROSS_NAME: ${{ matrix.qbt_cross_name }}
          MATRIX_LT_MOLD: ${{ matrix.qbt_linker_mold }}
        run: |
          printf '%s\n' "qbt_revision_url=${{ github.repository }}" > env.custom
          printf '%s\n' "qbt_zlib_type=zlib" >> env.custom
          printf '%s\n' "qbt_skip_icu=${set_skip_icu}" >> env.custom
          printf '%s\n' "qbt_openssl_tag=${INPUT_OPENSSL_TAG}" >> env.custom
          printf '%s\n' "qbt_boost_tag=${INPUT_BOOST_TAG}" >> env.custom
          printf '%s\n' "qbt_libtorrent_version=${MATRIX_LT_VERSION}" >> env.custom
          printf '%s\n' "qbt_libtorrent_tag=${INPUT_LT_TAG}" >> env.custom
          printf '%s\n' "qbt_libtorrent_master_jamfile=" >> env.custom
          printf '%s\n' "qbt_qt_version=${INPUT_QT_VERSION}" >> env.custom
          printf '%s\n' "qbt_qt_tag=${INPUT_QT_TAG}" >> env.custom
          printf '%s\n' "qbt_qbittorrent_tag=${INPUT_QBT_TAG}" >> env.custom
          printf '%s\n' "qbt_build_dir=${qbt_build_dir}" >> env.custom
          printf '%s\n' "qbt_build_tool=${MATRIX_BUILD_TOOL}" >> env.custom
          printf '%s\n' "qbt_cross_name=${MATRIX_CROSS_NAME}" >> env.custom
          printf '%s\n' "qbt_mcm_url=${set_qbt_mcm_url}" >> env.custom
          printf '%s\n' "qbt_patches_url=${{ github.repository }}" >> env.custom
          printf '%s\n' "qbt_workflow_files=${set_workflow_files}" >> env.custom
          printf '%s\n' "qbt_cache_dir=" >> env.custom
          printf '%s\n' "qbt_optimise_strip=" >> env.custom
          printf '%s\n' "qbt_build_debug=${set_build_debug}" >> env.custom
          printf '%s\n' "qbt_standard=" >> env.custom
          printf '%s\n' "qbt_static_ish=" >> env.custom
          printf '%s\n' "qbt_optimise=${qbt_optimise}" >> env.custom
          printf '%s\n' "qbt_with_qemu=${set_qbt_with_qemu}" >> env.custom
          printf '%s\n' "qbt_host_deps=${set_qbt_host_deps}" >> env.custom
          printf '%s\n' "qbt_host_deps_repo=${set_qbt_host_deps_repo}" >> env.custom
          printf '%s\n\n' "qbt_linker_mold=${MATRIX_LT_MOLD}" >> env.custom

      - name: Host - Debian based specific env
        if: matrix.os_id != 'alpine'
        run: |
          printf '%s\n' "LANG=C.UTF-8" >> env.custom
          printf '%s\n' "LC_ALL=C.UTF-8" >> env.custom
          printf '%s\n\n' "DEBIAN_FRONTEND=noninteractive" >> env.custom

      - name: Host - Bootstrap qemu
        uses: userdocs/actions/qemu@8cf6141527f0fd7b8403fb329907edf8dc2ad75f # v1.0.8
        with:
          target_arch: ${{ matrix.qbt_cross_name }}

      - name: Host - Bootstrap docker container
        uses: userdocs/actions/qbt_docker@8cf6141527f0fd7b8403fb329907edf8dc2ad75f # v1.0.8
        with:
          os_id: ${{ matrix.os_id }}
          os_version_id: ${{ matrix.os_version_id }}
          additional_apps: "curl git"

      - name: Host - patches
        if: hashFiles('patches/**') != ''
        run: mkdir -p "${qbt_build_dir}/patches" && cp -rf patches/* "${qbt_build_dir}/patches/"

      - name: Docker - bootstrap_deps
        if: inputs.script_name == 'qbt-nox-static.bash'
        run: docker exec "${container_name}" bash "${script_name}" bootstrap_deps

      - name: Docker - Bootstrap build
        run: docker exec "${container_name}" bash "${script_name}" -bs-a

      - name: Docker - glibc
        if: matrix.os_id != 'alpine'
        run: docker exec "${container_name}" bash "${script_name}" glibc

      - name: Docker - zlib
        run: docker exec "${container_name}" bash "${script_name}" zlib

      - name: Docker - iconv
        if: matrix.qbt_libtorrent_version == '1.2'
        run: docker exec "${container_name}" bash "${script_name}" iconv

      - name: Docker - icu
        if: env.set_skip_icu == 'no'
        run: docker exec "${container_name}" bash "${script_name}" icu

      - name: Docker - openssl
        run: docker exec "${container_name}" bash "${script_name}" openssl

      - name: Docker - boost
        run: docker exec "${container_name}" bash "${script_name}" boost

      - name: Docker - libtorrent
        run: docker exec "${container_name}" bash "${script_name}" libtorrent

      # - name: Docker - double_conversion
      #   if: matrix.qbt_build_tool == ''
      #   run: docker exec "${container_name}" bash "${script_name}" double_conversion

      - name: Docker - qtbase
        run: docker exec "${container_name}" bash "${script_name}" qtbase

      - name: Docker - qttools
        run: docker exec "${container_name}" bash "${script_name}" qttools

      - name: Docker - qbittorrent
        run: docker exec "${container_name}" bash "${script_name}" qbittorrent

      - name: Docker - Set release asset name
        run: docker exec -w ${wd}/${qbt_build_dir}/completed "${container_name}" mv -f qbittorrent-nox "${{ matrix.qbt_cross_name }}-${{ matrix.qbt_qt_version_name }}qbittorrent-nox"

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ env.qbt_build_dir }}/completed/${{ matrix.qbt_cross_name }}-${{ matrix.qbt_qt_version_name }}qbittorrent-nox"

      - name: Docker - Release Info
        working-directory: "${{ env.workspace }}/${{ env.qbt_build_dir }}/release_info"
        run: |
          mv *.md *.json "${workspace}/${qbt_build_dir}/completed"

      - name: Host - Upload libtorrent-v${{ matrix.qbt_libtorrent_version }}-qbittorrent-nox and release info artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libtorrent-v${{ matrix.qbt_libtorrent_version }}-${{ matrix.qbt_cross_name }}-${{ matrix.qbt_qt_version_name }}qbittorrent-nox
          path: |
            ${{ env.qbt_build_dir }}/completed/*
            !${{ env.qbt_build_dir }}/completed/*.png

      - name: Host - Upload cmake graphs artifact
        if: success() && matrix.qbt_build_tool == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "${{ matrix.qbt_cross_name }}-libtorrent-v${{ matrix.qbt_libtorrent_version }}-graphs"
          path: "${{ env.qbt_build_dir }}/completed/*.png"
      # - name: Host - Upload build dir on error or cancel
      #   if: ( cancelled() || failure() )
      #   uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      #   with:
      #     name: "${{ matrix.qbt_cross_name }}-libtorrent-v${{ matrix.qbt_libtorrent_version }}-logs"
      #     path: "${{ env.qbt_build_dir }}"
