name: ci - main reusable caller

on:
  workflow_dispatch:
    inputs:
      script_name:
        description: "Which script to run?"
        required: true
        default: "qbt-nox-static.bash"
        type: choice
        options: ["qbt-nox-static.bash", "qbittorrent-nox-static.sh"]
      debian-build:
        description: "Debian: build"
        required: true
        default: false
        type: boolean
      alpine-build:
        description: "Alpine: build"
        required: true
        default: true
        type: boolean
      workflow-files:
        description: "Workflow files"
        required: true
        default: true
        type: boolean
      icu:
        description: "Enable icu"
        required: true
        default: true
        type: boolean
      debug:
        description: "Debug builds (symbols)"
        required: true
        default: false
        type: boolean
      release:
        description: "Release assets?"
        required: true
        default: true
        type: boolean
      libtorrent_1_2:
        description: "Build libtorrent 1.2"
        required: true
        default: true
        type: boolean
      libtorrent_1_2_tag:
        description: "libtorrent 1.2 tag | RC_1_2"
        required: false
        type: string
      libtorrent_1_2_qbittorrent_tag:
        description: "qbt tag for libtorrent 1.2 | release-5.2.2"
        required: false
        type: string
      libtorrent_2_0:
        description: "Build libtorrent 2.0"
        required: true
        default: true
        type: boolean
      libtorrent_2_0_tag:
        description: "libtorrent 2.0 tag | RC_2_0"
        required: false
        type: string
      libtorrent_2_0_qbittorrent_tag:
        description: "qbt tag for libtorrent 2.0 | release-5.2.2"
        required: false
        type: string
      libtorrent_2_1:
        description: "Build libtorrent 2.1"
        required: true
        default: true
        type: boolean
      libtorrent_2_1_tag:
        description: "libtorrent 2.1 tag | RC_2_1"
        required: false
        type: string
      libtorrent_2_1_qbittorrent_tag:
        description: "qbt tag for libtorrent 2.1 | release-5.2.2"
        required: false
        type: string
      openssl_tag:
        description: "OpenSSL tag | openssl-3.6.2"
        required: false
        type: string
      boost_tag:
        description: "Boost tag | boost-1.91.0-1"
        required: false
        type: string
      qt_version:
        description: "Qt version | 6"
        required: false
        type: string
      qt_tag:
        description: "Qt tag | v6.11.1"
        required: false
        type: string
      skip_rerun:
        description: "Skip rerun?"
        required: true
        default: true
        type: boolean
      retries:
        description: "Number of rerun retries"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

permissions: {}

jobs:
  ci-debian-build:
    if: github.event.inputs.debian-build == 'true'
    concurrency:
      group: ci-debian-build
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      attestations: write
    uses: $/.github/workflows/ci-debian-build.yml
    with:
      workflow-files: ${{ github.event.inputs.workflow-files == 'true' && 'yes' || 'no' }}
      icu: ${{ github.event.inputs.icu == 'true' && 'no' || 'yes' }}
      debug: ${{ github.event.inputs.debug == 'true' && 'yes' || 'no' }}
      script_name: ${{ github.event.inputs.script_name }}

  ci-alpine-build:
    if: github.event.inputs.alpine-build == 'true'
    concurrency:
      group: ci-alpine-build
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      attestations: write
    uses: $/.github/workflows/ci-alpine-build.yml
    with:
      workflow-files: ${{ github.event.inputs.workflow-files == 'true' && 'yes' || 'no' }}
      icu: ${{ github.event.inputs.icu == 'true' && 'no' || 'yes' }}
      debug: ${{ github.event.inputs.debug == 'true' && 'yes' || 'no' }}
      script_name: ${{ github.event.inputs.script_name }}
      libtorrent_1_2: ${{ github.event.inputs.libtorrent_1_2 == 'true' }}
      libtorrent_2_0: ${{ github.event.inputs.libtorrent_2_0 == 'true' }}
      libtorrent_2_1: ${{ github.event.inputs.libtorrent_2_1 == 'true' }}
      libtorrent_1_2_tag: ${{ github.event.inputs.libtorrent_1_2_tag }}
      libtorrent_1_2_qbittorrent_tag: ${{ github.event.inputs.libtorrent_1_2_qbittorrent_tag }}
      libtorrent_2_0_tag: ${{ github.event.inputs.libtorrent_2_0_tag }}
      libtorrent_2_0_qbittorrent_tag: ${{ github.event.inputs.libtorrent_2_0_qbittorrent_tag }}
      libtorrent_2_1_tag: ${{ github.event.inputs.libtorrent_2_1_tag }}
      libtorrent_2_1_qbittorrent_tag: ${{ github.event.inputs.libtorrent_2_1_qbittorrent_tag }}
      openssl_tag: ${{ github.event.inputs.openssl_tag }}
      boost_tag: ${{ github.event.inputs.boost_tag }}
      qt_version: ${{ github.event.inputs.qt_version }}
      qt_tag: ${{ github.event.inputs.qt_tag }}

  ci-alpine-release:
    needs: [ci-alpine-build]
    if: github.event.inputs.release == 'true' && contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    concurrency:
      group: ci-alpine-release
      cancel-in-progress: true
    permissions:
      contents: write
    uses: $/.github/workflows/ci-alpine-release.yml
    with:
      libtorrent_1_2: ${{ github.event.inputs.libtorrent_1_2 == 'true' }}
      libtorrent_2_0: ${{ github.event.inputs.libtorrent_2_0 == 'true' }}
      libtorrent_2_1: ${{ github.event.inputs.libtorrent_2_1 == 'true' }}

  ci-auto-rerun-failed-jobs:
    if: failure() && (github.event.inputs.skip_rerun || 'false') == 'false'
    needs: [ci-debian-build, ci-alpine-build, ci-alpine-release]
    concurrency:
      group: ci-auto-rerun-failed-jobs
      cancel-in-progress: true
    permissions:
      actions: write
    runs-on: ubuntu-26.04-arm
    environment: production
    env:
      GH_TOKEN: "${{ secrets.AUTO_RERUN || github.token }}"
      github_repo: "" # To use ci-auto-rerun-failed-jobs.yml hosted in a remote repository else default to the current repository. Requires PAT token AUTO_RERUN
      retries: ${{ github.event.inputs.retries || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ci-auto-rerun-failed-jobs via ${{ env.github_repo || github.repository }}
        run: >
          gh workflow run ci-auto-rerun-failed-jobs-action.yml
          --repo "${github_repo:-$GITHUB_REPOSITORY}"
          -f github_repo=${GITHUB_REPOSITORY}
          -f run_id=${GITHUB_RUN_ID}
          -f attempts=${GITHUB_RUN_ATTEMPT}
          -f retries=${retries}
